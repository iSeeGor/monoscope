[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monoscope"
version = "0.1.0"
description = "Local Monobank expense analysis and reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[project.scripts]
monoscope = "monoscope.cli:main"

[tool.setuptools.packages.find]
include = ["apps*", "monoscope*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
